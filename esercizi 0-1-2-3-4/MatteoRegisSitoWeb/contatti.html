<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatti - Guida Turistica Firenze</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Discover Firenze</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="cosa-vedere.html">Cosa vedere</a></li>
            <li class="nav-item"><a class="nav-link" href="itinerario.html">Itinerario</a></li>
            <li class="nav-item"><a class="nav-link active" href="contatti.html">Contatti</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <h1 class="text-center mb-3">Richiedi Informazioni</h1>
        <p class="text-center text-muted mb-4">Compila il modulo per qualsiasi informazione sui tour o per ricevere assistenza personale.</p>

        <!-- Area per messaggi di errore/conferma generati via JS -->
        <div id="alertMessage" class="d-none"></div>

        <form id="contactForm" class="p-4 bg-white rounded shadow-sm border" novalidate>
          <!-- Nome e Cognome -->
          <div class="mb-3">
            <label for="nomeCognome" class="form-label fw-bold">Nome e Cognome *</label>
            <input type="text" class="form-control" id="nomeCognome" placeholder="Es. Mario Rossi" required>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label fw-bold">Email *</label>
            <input type="email" class="form-control" id="email" placeholder="Es. mario.rossi@email.com" required>
          </div>

          <!-- Menu a tendina -->
          <div class="mb-3">
            <label for="tipoRichiesta" class="form-label fw-bold">Motivo della richiesta *</label>
            <select class="form-select" id="tipoRichiesta" required>
              <option value="" selected disabled>Seleziona un'opzione...</option>
              <option value="Informazioni Generali">Informazioni generali su Firenze</option>
              <option value="Prenotazione Tour">Prenotazione Tour guidato</option>
              <option value="Accessibilità e Mobilità">Info su accessibilità e trasporti</option>
            </select>
          </div>

          <!-- Messaggio opzionale -->
          <div class="mb-3">
            <label for="messaggio" class="form-label fw-bold">Messaggio</label>
            <textarea class="form-control" id="messaggio" rows="4" placeholder="Scrivi qui le tue domande..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100">Invia Richiesta</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2026 Guida Turistica Firenze - I.I.S. G. Vallauri. Tutti i diritti riservati.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Collegamento allo script JS separato -->
  <script src="js/script.js"></script>
</body>
</html>
